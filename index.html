<!DOCTYPE html>
<html lang="en" class="font-Roboto">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <link rel="stylesheet" href="css/5a90c3ba14f91210.css">
    <title>Guess the Video Date | ChiefXD</title>
    <style>
        /* Algemene achtergrond met gradient */
        body {
            background: linear-gradient(to right, #1e293b, #334155, #0f172a);
            overflow: hidden;
            margin: 0;
            padding: 0;
            font-family: Roboto, sans-serif;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .container {
            max-width: 800px;
            text-align: center;
        }

        iframe {
            width: 100%;
            height: 360px;
            border: none;
            margin-bottom: 1rem;
            border-radius: 10px;
        }

        .slider-container, .result-container {
            margin-top: 1rem;
            text-align: center;
        }

        .slider-container {
            display: none;
        }

        .result-container {
            display: none;
        }

        .points-display {
            font-size: 1.5rem;
            margin-top: 1rem;
        }

        .points-box {
            display: inline-block;
            padding: 1rem;
            border: 2px solid #4ade80;
            border-radius: 10px;
            font-size: 2rem;
            background: linear-gradient(to right, #ff7e79, #ffdf88);
            color: black;
            font-weight: bold;
        }

        .result-message {
            margin-top: 1rem;
            font-size: 1.2rem;
            color: #f87171;
        }

        button {
            margin-top: 1rem;
            padding: 0.5rem 1rem;
            background-color: #3b82f6;
            border: none;
            border-radius: 5px;
            color: white;
            font-size: 1rem;
            cursor: pointer;
        }

        button:hover {
            background-color: #2563eb;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Guess the Video Date</h1>
        <iframe id="videoPlayer" src="" allowfullscreen></iframe>
        <h2 id="videoTitle">Loading random video...</h2>

        <!-- Slider -->
        <div class="slider-container">
            <p class="slider-label">
                Guess the date: <span id="sliderMonth">January</span> <span id="sliderYear">2023</span>
            </p>
            <input type="range" id="dateSlider" min="0" max="24" value="0">
            <button id="confirmButton">Confirm</button>
        </div>

        <!-- Result -->
        <div class="result-container">
            <div class="points-display">
                <span class="points-box" id="pointsBox">0 / 1000</span>
            </div>
            <p class="result-message" id="resultMessage"></p>
            <button id="nextButton">Next</button>
        </div>
    </div>

    <script>
        const videos = [
            { id: "uLC7XiUdL4c", title: "I Spent One Year Surviving Minecraft Horror Mods… Here’s What Happened", date: "2025-01-03" },
            { id: "Xl04ohxC4AM", title: "Surviving Minecraft's Scariest Winter Mod", date: "2024-12-24" },
        ];

        const videoPlayer = document.getElementById("videoPlayer");
        const videoTitle = document.getElementById("videoTitle");
        const slider = document.getElementById("dateSlider");
        const sliderMonthLabel = document.getElementById("sliderMonth");
        const sliderYearLabel = document.getElementById("sliderYear");
        const confirmButton = document.getElementById("confirmButton");
        const nextButton = document.getElementById("nextButton");
        const resultMessage = document.getElementById("resultMessage");
        const pointsBox = document.getElementById("pointsBox");

        const sliderContainer = document.querySelector(".slider-container");
        const resultContainer = document.querySelector(".result-container");

        let randomVideos = [];
        let currentVideo = null;
        let totalPoints = 0;

        function pickRandomVideos() {
            const shuffled = videos.sort(() => 0.5 - Math.random());
            randomVideos = shuffled.slice(0, 5);
        }

        function loadRandomVideo() {
            currentVideo = randomVideos.shift();
            videoPlayer.src = `https://www.youtube.com/embed/${currentVideo.id}`;
            videoTitle.textContent = currentVideo.title;
            showSlider();
        }

        function setupSlider() {
            const startYear = 2023;
            const startMonth = 0;
            const totalMonths = 24;

            slider.max = totalMonths;
            slider.value = 0;
            updateSliderLabels(startYear, startMonth, slider.value);

            slider.addEventListener("input", () => updateSliderLabels(startYear, startMonth, slider.value));
        }

        function updateSliderLabels(startYear, startMonth, value) {
            const date = new Date(startYear, startMonth + parseInt(value));
            const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
            sliderMonthLabel.textContent = monthNames[date.getMonth()];
            sliderYearLabel.textContent = date.getFullYear();
        }

        confirmButton.addEventListener("click", () => {
            const sliderDate = new Date(2023, 0 + parseInt(slider.value));
            const actualDate = new Date(currentVideo.date);
            const difference = Math.round((actualDate - sliderDate) / (1000 * 60 * 60 * 24 * 30.44));
            const points = Math.max(0, 1000 - Math.abs(difference) * 20);

            totalPoints += points;
            pointsBox.textContent = `${totalPoints} / 1000`;

            resultMessage.textContent = difference === 0
                ? "Correct! You guessed the exact date!"
                : `You were ${Math.abs(difference)} months off. The actual date is ${actualDate.toLocaleString("en", { month: "long" })} ${actualDate.getFullYear()}.`;

            resultMessage.style.color = difference === 0 ? "#4ade80" : "#f87171";

            showResult();
        });

        nextButton.addEventListener("click", () => {
            if (randomVideos.length > 0) {
                resultMessage.textContent = "";
                loadRandomVideo();
            } else {
                resultMessage.textContent = "Game over!";
                nextButton.disabled = true;
            }
        });

        function showSlider() {
            sliderContainer.style.display = "block";
            resultContainer.style.display = "none";
        }

        function showResult() {
            sliderContainer.style.display = "none";
            resultContainer.style.display = "block";
        }

        pickRandomVideos();
        loadRandomVideo();
        setupSlider();
    </script>
</body>
</html>
