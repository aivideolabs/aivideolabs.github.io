<!DOCTYPE html>
<html lang="en" class="font-Roboto">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <link rel="stylesheet" href="css/5a90c3ba14f91210.css">
    <title>Guess the Video Date | ChiefXD</title>
    <style>
        /* Stijl voor de gridachtergrond */
        .bg-grid-slate {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: linear-gradient(to right, rgba(255, 255, 255, 0.1) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(255, 255, 255, 0.1) 1px, transparent 1px);
            background-size: 120px 120px;
            z-index: -1;
        }

        /* Algemene achtergrond met gradient */
        body {
            background: linear-gradient(to right, #1e293b, #334155, #0f172a);
            overflow: hidden;
            margin: 0;
            padding: 0;
            font-family: Roboto, sans-serif;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        /* Container stijl */
        .container {
            max-width: 800px;
            text-align: center;
        }

        iframe {
            width: 100%;
            height: 360px;
            border: none;
            margin-bottom: 1rem;
            border-radius: 10px;
        }

        .slider-container {
            margin-top: 1rem;
            text-align: center;
        }

        .slider-label {
            font-size: 1.2rem;
            margin-bottom: 0.5rem;
        }

        input[type="range"] {
            width: 100%;
        }

        button {
            margin-top: 1rem;
            padding: 0.5rem 1rem;
            background-color: #3b82f6;
            border: none;
            border-radius: 5px;
            color: white;
            font-size: 1rem;
            cursor: pointer;
        }

        button:hover {
            background-color: #2563eb;
        }

        .result {
            margin-top: 1rem;
            font-size: 1.2rem;
            color: #f87171;
        }
    </style>
</head>
<body>
    <div class="bg-grid-slate"></div>
    <div class="container">
        <h1>Guess the Video Date</h1>
        <iframe id="videoPlayer" src="" allowfullscreen></iframe>
        <h2 id="videoTitle">Loading random video...</h2>

        <!-- Slider -->
        <div class="slider-container">
            <p class="slider-label">
                Guess the date: <span id="sliderMonth">January</span> <span id="sliderYear">2023</span>
            </p>
            <input type="range" id="dateSlider" min="0" max="24" value="0">
            <button id="confirmButton">Confirm</button>
            <p class="result" id="resultMessage"></p>
        </div>
    </div>

    <script>
        // Gegevens uit het TXT-bestand (alle video's)
        const videos = [
            { id: "uLC7XiUdL4c", title: "I Spent One Year Surviving Minecraft Horror Mods… Here’s What Happened", date: "2025-01-03" },
            { id: "Xl04ohxC4AM", title: "Surviving Minecraft's Scariest Winter Mod", date: "2024-12-24" },
            { id: "a7clSlWlZo4", title: "I Conquered Minecraft's Scariest Mods [FULL MOVIE]", date: "2024-12-20" },
            { id: "4hgA4HcUgik", title: "Surviving a Haunted Shipwreck Island in Hardcore Minecraft", date: "2024-12-12" },
            { id: "24pmZDVdeOE", title: "Minecraft's Scariest Mod is Now Even Scarier", date: "2024-12-05" },
            { id: "aDhabaOKwUI", title: "I Spent 100 Days Plotting the Ultimate Minecraft Revenge", date: "2024-11-29" },
            { id: "o21z3mZDSO0", title: "Surviving Minecraft's Most Disturbing Mods for 100 Days in Hardcore 7", date: "2024-11-22" },
            { id: "xcOUWGbUpVE", title: "Surviving a Terrifying Alien Mod in Minecraft Hardcore", date: "2024-11-13" },
            // Voeg hier alle video's toe uit het bestand
        ];

        const videoPlayer = document.getElementById("videoPlayer");
        const videoTitle = document.getElementById("videoTitle");
        const slider = document.getElementById("dateSlider");
        const sliderMonthLabel = document.getElementById("sliderMonth");
        const sliderYearLabel = document.getElementById("sliderYear");
        const confirmButton = document.getElementById("confirmButton");
        const resultMessage = document.getElementById("resultMessage");

        let randomVideos = [];
        let currentVideo = null;

        // Kies 5 unieke video's
        function pickRandomVideos() {
            const shuffled = videos.sort(() => 0.5 - Math.random());
            randomVideos = shuffled.slice(0, 5);
        }

        // Laad een video
        function loadRandomVideo() {
            currentVideo = randomVideos.shift();
            videoPlayer.src = `https://www.youtube.com/embed/${currentVideo.id}`;
            videoTitle.textContent = currentVideo.title;
        }

        // Slider instellen
        function setupSlider() {
            const startYear = 2023;
            const startMonth = 0; // Januari
            const totalMonths = 24; // Januari 2023 tot heden
            slider.max = totalMonths;
            slider.value = 0;

            updateSliderLabels(startYear, startMonth, slider.value);
            slider.addEventListener("input", () => updateSliderLabels(startYear, startMonth, slider.value));
        }

        // Labels updaten
        function updateSliderLabels(startYear, startMonth, value) {
            const date = new Date(startYear, startMonth + parseInt(value));
            const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
            sliderMonthLabel.textContent = monthNames[date.getMonth()];
            sliderYearLabel.textContent = date.getFullYear();
        }

        // Gok bevestigen
        confirmButton.addEventListener("click", () => {
            const sliderDate = new Date(2023, 0 + parseInt(slider.value));
            const actualDate = new Date(currentVideo.date);
            const difference = Math.round((actualDate - sliderDate) / (1000 * 60 * 60 * 24 * 30.44));

            if (difference === 0) {
                resultMessage.textContent = "Correct! You guessed the exact date!";
                resultMessage.style.color = "#4ade80";
            } else {
                resultMessage.textContent = `You were ${Math.abs(difference)} month(s) ${difference > 0 ? "early" : "late"}.`;
                resultMessage.style.color = "#f87171";
            }

            if (randomVideos.length > 0) {
                setTimeout(() => {
                    resultMessage.textContent = "";
                    loadRandomVideo();
                }, 3000);
            } else {
                resultMessage.textContent += " Game over!";
            }
        });

        // Start de game
        pickRandomVideos();
        loadRandomVideo();
        setupSlider();
    </script>
</body>
</html>
