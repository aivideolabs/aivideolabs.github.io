<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChiefXD Video Guessing Game</title>
    <style>
        /* Algemene stijl */
        body {
            background: linear-gradient(to right, #1e293b, #334155, #0f172a);
            font-family: Roboto, sans-serif;
            color: white;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        h1 {
            margin-bottom: 1rem;
            font-size: 1.5rem;
            text-align: center;
            color: #cbd5e1;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 90%;
            max-width: 1200px;
            height: 80%;
        }

        .video-section, .slider-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .video-section iframe {
            width: 80%;
            max-width: 600px;
            height: 315px;
            border-radius: 10px;
            border: none;
        }

        .slider-section {
            margin-top: 1rem;
            text-align: center;
        }

        .slider-section input[type="range"] {
            width: 80%;
        }

        .slider-label {
            margin: 1rem 0;
            font-size: 1.2rem;
            color: #cbd5e1;
        }

        .result {
            margin-top: 1rem;
            font-size: 1.2rem;
        }

        button {
            margin-top: 1rem;
            padding: 0.5rem 1rem;
            background-color: #3b82f6;
            border: none;
            border-radius: 5px;
            color: white;
            cursor: pointer;
            font-size: 1rem;
        }

        button:hover {
            background-color: #2563eb;
        }
    </style>
</head>
<body>
    <h1>ChiefXD Video Guessing Game</h1>
    <div class="container">
        <!-- Video Sectie -->
        <div class="video-section">
            <iframe id="videoPlayer" src="" allowfullscreen></iframe>
            <h2 id="videoTitle">Loading a random video...</h2>
        </div>

        <!-- Slider Sectie -->
        <div class="slider-section">
            <p class="slider-label">Guess the date: <span id="sliderMonth">January</span> <span id="sliderYear">2023</span></p>
            <input type="range" id="dateSlider" min="0" max="24" value="0" />
            <button id="confirmButton">Confirm</button>
            <p class="result" id="resultMessage"></p>
        </div>
    </div>

    <script>
        const apiKey = 'AIzaSyDr8m5EpPgSdS-MF-rk00HV8rk1jJFQh9E';
        const channelId = 'UCZ7jSWwFSdFw8hDbihBXZeQ'; // ChiefXD's Channel ID
        const videoPlayer = document.getElementById('videoPlayer');
        const videoTitle = document.getElementById('videoTitle');
        const slider = document.getElementById('dateSlider');
        const sliderMonthLabel = document.getElementById('sliderMonth');
        const sliderYearLabel = document.getElementById('sliderYear');
        const confirmButton = document.getElementById('confirmButton');
        const resultMessage = document.getElementById('resultMessage');

        let videos = [];
        let randomVideo = null;
        let firstVideoDate = null;

        // Maanden voor weergave
        const monthNames = [
            "January", "February", "March", "April", "May", "June",
            "July", "August", "September", "October", "November", "December"
        ];

        // Video's ophalen
        async function fetchVideos() {
            try {
                const videoResponse = await fetch(`https://www.googleapis.com/youtube/v3/search?key=${apiKey}&channelId=${channelId}&part=snippet&order=date&maxResults=50`);
                const videoData = await videoResponse.json();
                videos = videoData.items.filter(video => video.id.videoId);
                randomVideo = videos[Math.floor(Math.random() * videos.length)];
                firstVideoDate = new Date(videos[videos.length - 1].snippet.publishedAt);

                loadRandomVideo(randomVideo);
                setupSlider(firstVideoDate, new Date());
            } catch (error) {
                console.error('Error fetching videos:', error);
                videoTitle.textContent = "Failed to load videos.";
            }
        }

        // Random video laden
        function loadRandomVideo(video) {
            videoPlayer.src = `https://www.youtube.com/embed/${video.id.videoId}`;
            videoTitle.textContent = video.snippet.title;
        }

        // Slider instellen
        function setupSlider(startDate, endDate) {
            const startYear = startDate.getFullYear();
            const startMonth = startDate.getMonth();
            const totalMonths = (endDate.getFullYear() - startYear) * 12 + endDate.getMonth() - startMonth;

            slider.max = totalMonths;
            slider.value = 0;

            updateSliderLabels(startYear, startMonth, slider.value);

            // Live update van labels terwijl de slider beweegt
            slider.addEventListener('input', () => updateSliderLabels(startYear, startMonth, slider.value));
        }

        // Labels updaten
        function updateSliderLabels(startYear, startMonth, value) {
            const selectedDate = new Date(startYear, startMonth + parseInt(value));
            sliderMonthLabel.textContent = monthNames[selectedDate.getMonth()];
            sliderYearLabel.textContent = selectedDate.getFullYear();
        }

        // Bevestig de gok
        confirmButton.addEventListener('click', () => {
            const selectedDate = new Date(firstVideoDate.getFullYear(), firstVideoDate.getMonth() + parseInt(slider.value));
            const actualDate = new Date(randomVideo.snippet.publishedAt);
            const differenceInMonths = Math.round((actualDate - selectedDate) / (1000 * 60 * 60 * 24 * 30.44));

            if (differenceInMonths === 0) {
                resultMessage.textContent = "Correct! You guessed the exact date!";
                resultMessage.style.color = "#4ade80";
            } else {
                resultMessage.textContent = `You were ${Math.abs(differenceInMonths)} month(s) ${differenceInMonths > 0 ? "early" : "late"}.`;
                resultMessage.style.color = "#f87171";
            }
        });

        // Start
        fetchVideos();
    </script>
</body>
</html>
