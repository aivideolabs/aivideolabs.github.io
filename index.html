        const videoPlayer = document.getElementById("videoPlayer");
        const videoTitle = document.getElementById("videoTitle");
        const slider = document.getElementById("dateSlider");
        const sliderMonthLabel = document.getElementById("sliderMonth");
        const sliderYearLabel = document.getElementById("sliderYear");
        const confirmButton = document.getElementById("confirmButton");
        const nextButton = document.getElementById("nextButton");
        const resultMessage = document.getElementById("resultMessage");
        const pointsBox = document.getElementById("pointsBox");

        const sliderContainer = document.querySelector(".slider-container");
        const resultContainer = document.querySelector(".result-container");

        let randomVideos = [];
        let currentVideo = null;
        let totalPoints = 0;

        const startYear = 2023;
        const startMonth = 6; // July 2023

        function pickRandomVideos() {
            const shuffled = videos.sort(() => 0.5 - Math.random());
            randomVideos = shuffled.slice(0, 5);
        }

        function loadRandomVideo() {
            currentVideo = randomVideos.shift();
            videoPlayer.src = `https://www.youtube.com/embed/${currentVideo.id}`;
            videoTitle.textContent = currentVideo.title;
            showSlider();
        }

        function setupSlider() {
            slider.max = 18; // July 2023 to January 2025 = 18 months
            slider.value = 0;
            updateSliderLabels(slider.value);

            slider.addEventListener("input", () => updateSliderLabels(slider.value));
        }

        function updateSliderLabels(value) {
            const date = new Date(startYear, startMonth + parseInt(value));
            const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
            sliderMonthLabel.textContent = monthNames[date.getMonth()];
            sliderYearLabel.textContent = date.getFullYear();
        }

        function calculatePoints(monthsOff) {
            if (monthsOff === 0) return 1000;
            if (monthsOff === 1) return 900;
            if (monthsOff === 2) return 800;
            if (monthsOff === 3) return 600;
            if (monthsOff === 4) return 400;
            if (monthsOff === 5) return 200;
            if (monthsOff === 6) return 100;
            return 0;
        }

        confirmButton.addEventListener("click", () => {
            const sliderDate = new Date(startYear, startMonth + parseInt(slider.value));
            const actualDate = new Date(currentVideo.date);
            const monthsOff = Math.abs((actualDate.getFullYear() - sliderDate.getFullYear()) * 12 + (actualDate.getMonth() - sliderDate.getMonth()));
            const points = calculatePoints(monthsOff);

            totalPoints += points;
            pointsBox.textContent = `${totalPoints} / 5000`;

            resultMessage.textContent = monthsOff === 0
                ? "Correct! You guessed the exact date!"
                : `You were ${monthsOff} months off. The actual date is ${actualDate.toLocaleString("en", { month: "long" })} ${actualDate.getFullYear()}.`;

            resultMessage.style.color = monthsOff === 0 ? "#4ade80" : "#f87171";

            showResult();
        });

        nextButton.addEventListener("click", () => {
            if (randomVideos.length > 0) {
                resultMessage.textContent = "";
                loadRandomVideo();
            } else {
                resultMessage.textContent = "Game over!";
                nextButton.disabled = true;
            }
        });

        function showSlider() {
            sliderContainer.style.display = "block";
            resultContainer.style.display = "none";
        }

        function showResult() {
            sliderContainer.style.display = "none";
            resultContainer.style.display = "block";
        }

        pickRandomVideos();
        loadRandomVideo();
        setupSlider();
    </script>
